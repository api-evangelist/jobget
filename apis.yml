aid: jobget
name: JobGet
description: 'JobGet is a Boston, Massachusetts based hourly and frontline hiring network
  that operates a mobile-first job marketplace for workers in food service, retail,
  hospitality, healthcare, warehousing and trucking. Job seekers build a profile in
  the JobGet app, receive AI matched recommendations from the JobGenie assistant, apply
  with one tap, and message or interview with hiring managers directly in the app. On
  the employer side JobGet sells SMB self-serve job posting and an enterprise suite
  (SpendSmart budget reallocation, HireReady screening and interview scheduling, and
  Network Access) that plugs into existing applicant tracking systems including Workday,
  Greenhouse, ADP, UKG, SAP SuccessFactors, SmartRecruiters, Bullhorn and Fountain.
  Through its acquisitions of Snagajob, Seasoned and Foh&Boh the company reaches a
  stated network of 100M+ everyday workers. JobGet publishes no public developer portal,
  API documentation or machine-readable API specification; its production API host
  api.jobget.com is publicly reachable but undocumented, and ATS connectivity is
  delivered as a managed integration rather than a self-serve API.'
