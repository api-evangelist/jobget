apis:
- aid: jobget:platform-api
  name: JobGet Platform API
  description: 'The production API host that backs the JobGet mobile applications and
    employer web experience. The host is publicly reachable over HTTPS and returns a
    structured RFC 9457 application/problem+json error envelope with a correlationId,
    but JobGet publishes no developer portal, no reference documentation, no
    authentication guide and no OpenAPI/Swagger/GraphQL description for it. Everything
    recorded about this API in this repository was observed by anonymous HTTP probe of
    public endpoints; no credentials were used and no access control was defeated.'
  humanURL: https://www.jobget.com/
  baseURL: https://api.jobget.com
  tags:
  - Job
  - Hiring
  - Undocumented
  tags_raw:
  - Jobs
  - Hiring
  - Undocumented
