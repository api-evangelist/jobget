- aid: jobget:site-mcp
  name: JobGet Site MCP Server
  description: 'A Model Context Protocol endpoint served from JobGet''s own blog host
    at https://blog.jobget.com/_api/mcp and advertised in JobGet''s published llms.txt.
    It is the Wix Site MCP server provided by the underlying Wix platform rather than a
    JobGet-authored API server: an anonymous tools/list returned HTTP 200 with nine
    tools for reading site content, retrieving business details, generating a visitor
    token and calling Wix site APIs on a visitor''s behalf. It exposes JobGet''s public
    blog content to agents; it does not expose the JobGet jobs, application or employer
    data model.'
  humanURL: https://blog.jobget.com/
  baseURL: https://blog.jobget.com/_api/mcp
